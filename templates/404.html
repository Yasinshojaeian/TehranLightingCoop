{% extends 'base.html' %}
{% load static %}
{% block main %}
    <!-- Main -->
    <main>
        <!-- Page Banner -->
        <div class="page-banner overlay">
            <picture class="media media-bg">
                <source media="(max-width: 575px)" srcset="{% static '/img/banner/page-banner-575.jpg' %}">
                <source media="(max-width: 991px)" srcset="{% static '/img/banner/page-banner-991.jpg' %}">
                <img alt="تصویر بنر صفحه" height="520" loading="eager" src="{% static '/img/banner/page-banner.jpg' %}"
                     width="1920"/>
                </source>
                </source>
            </picture>
            <div class="page-banner-content">
                <div class="container text-center">
                    <h1 class="heading text-80 fw-700" data-aos="fade-up">
                        صفحه خطا
                    </h1>
                    <ul class="breadcrumb list-unstyled" data-aos="fade-up" data-aos-delay="100">
                        <li>
                            <a aria-label="Home Page" class="text text-18" href="{% url 'home:home' %}">
                                صفحه اصلی
                            </a>
                        </li>
                        <li>
                            <svg fill="none" height="12" viewbox="0 0 8 12" class="customiconrtl" width="8"
                                 xmlns="http://www.w3.org/2000/svg">
                                <path clip-rule="evenodd"
                                      d="M7.08929 5.40903C7.24552 5.5653 7.33328 5.77723 7.33328 5.9982C7.33328 6.21917 7.24552 6.43109 7.08929 6.58736L2.37512 11.3015C2.29825 11.3811 2.2063 11.4446 2.10463 11.4883C2.00296 11.532 1.89361 11.5549 1.78296 11.5559C1.67231 11.5569 1.56258 11.5358 1.46016 11.4939C1.35775 11.452 1.2647 11.3901 1.18646 11.3119C1.10822 11.2336 1.04634 11.1406 1.00444 11.0382C0.962537 10.9357 0.941453 10.826 0.942414 10.7154C0.943376 10.6047 0.966364 10.4954 1.01004 10.3937C1.05371 10.292 1.1172 10.2001 1.19679 10.1232L5.32179 5.9982L1.19679 1.8732C1.04499 1.71603 0.960996 1.50553 0.962894 1.28703C0.964793 1.06853 1.05243 0.859522 1.20694 0.705015C1.36145 0.550508 1.57046 0.462868 1.78896 0.460969C2.00745 0.45907 2.21795 0.543066 2.37512 0.694864L7.08929 5.40903Z"
                                      fill="currentColor" fill-rule="evenodd">
                                </path>
                            </svg>
                        </li>
                        <li>
                            <a aria-disabled="true" class="text text-18 active" role="link">
                                404
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <!-- 404 Section -->
        <div class="section-error section-padding">
            <div class="container">
                <div class="section-headings text-center">
                    <div class="error-media" data-aos="zoom-in-up">
                        <img alt="تصویر خطای 404" height="277" loading="lazy" src="{% static '/img/error/error.png' %}"
                             width="658"/>
                    </div>
                    <p class="text text-18" data-aos="fade-up">
                        با عرض پوزش، صفحه ای که به دنبال آن هستید وجود ندارد. اگر فکر می کنید
                        چیزی خراب است، یک مشکل را گزارش کنید.
                    </p>
                    <div class="buttons" data-aos="fade-up">
                        <a aria-label="Back to Home" class="button button--primary" href="{% url 'home:home' %}">
                            بازگشت به خانه
                            <span class="svg-wrapper">
         <svg class="icon-20" fill="none" height="20" viewbox="0 0 20 20" width="20" xmlns="http://www.w3.org/2000/svg">
          <path d="M13.3365 7.84518L6.16435 15.0173L4.98584 13.8388L12.158 6.66667H5.83652V5H15.0032V14.1667H13.3365V7.84518Z"
                fill="CurrentColor">
          </path>
         </svg>
        </span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>
{% endblock %}
