{% load i18n %}
{% load static %}

<!-- Header 1 -->
<sticky-header data-sticky-type="always">
    <header class="header-1 header-floating">
        <div class="container-fluid">
            <div class="header-grid">

                <!-- Logo -->
                <a aria-label="Consulo"
                   class="header-logo"
                   href="{% url 'home:home' %}">

                    <img alt="لوگوی شرکت"
                         height="32"
                         src="{% static 'img/logon1.png' %}"
                         style="width: 130px"
                         width="189"/>
                </a>


                <!-- Navigation -->
                <drawer-menu>
                    <nav class="header-nav drawer-menu">

                        <!-- Mobile Menu Header -->
                        <div class="d-lg-none header-nav-headings">

                            <a aria-label="Consulo"
                               class="header-logo"
                               href="{% url 'home:home' %}">

                                <img alt="لوگوی شرکت"
                                     height="32"
                                     loading="lazy"
                                     src="{% static 'img/logo-light.png' %}"
                                     width="189"/>
                            </a>

                            <drawer-opener class="svg-wrapper menu-close"
                                           data-drawer=".drawer-menu">

                                <svg fill="none"
                                     height="30px"
                                     viewbox="0 0 24 24"
                                     width="30px"
                                     xmlns="http://www.w3.org/2000/svg">

                                    <path d="M8.00386 9.41816C7.61333 9.02763 7.61334 8.39447 8.00386 8.00395C8.39438 7.61342 9.02755 7.61342 9.41807 8.00395L12.0057 10.5916L14.5907 8.00657C14.9813 7.61605 15.6144 7.61605 16.0049 8.00657C16.3955 8.3971 16.3955 9.03026 16.0049 9.42079L13.4199 12.0058L16.0039 14.5897C16.3944 14.9803 16.3944 15.6134 16.0039 16.0039C15.6133 16.3945 14.9802 16.3945 14.5896 16.0039L12.0057 13.42L9.42097 16.0048C9.03045 16.3953 8.39728 16.3953 8.00676 16.0048C7.61624 15.6142 7.61624 14.9811 8.00676 14.5905L10.5915 12.0058L8.00386 9.41816Z"
                                          fill="currentColor">
                                    </path>

                                    <path clip-rule="evenodd"
                                          d="M23 12C23 18.0751 18.0751 23 12 23C5.92487 23 1 18.0751 1 12C1 5.92487 5.92487 1 12 1C18.0751 1 23 5.92487 23 12ZM3.00683 12C3.00683 16.9668 7.03321 20.9932 12 20.9932C16.9668 20.9932 20.9932 16.9668 20.9932 12C20.9932 7.03321 16.9668 3.00683 12 3.00683C7.03321 3.00683 3.00683 7.03321 3.00683 12Z"
                                          fill="currentColor"
                                          fill-rule="evenodd">
                                    </path>

                                </svg>

                            </drawer-opener>

                        </div>


                        <!-- Menu -->
                        <ul class="header-menu list-unstyled">

                            <!-- Home -->
                            <li class="nav-item">
                                <a class="menu-link menu-link-main menu-accrodion"
                                   href="{% url 'home:home' %}">
                                    {% trans 'صفحه اصلی' %}
                                </a>
                            </li>


                            <!-- About -->
                            <li class="nav-item">
                                <a class="menu-link menu-link-main"
                                   href="{% url 'home:about-us' %}">
                                    {% trans 'درباره ما' %}
                                </a>
                            </li>


                            <!-- Gallery -->
                            <li class="nav-item">
                                <a class="menu-link menu-link-main"
                                   href="{% url 'home:albums' %}">
                                    {% trans 'گالری تصاویر' %}
                                </a>
                            </li>


                            <!-- Articles -->
                            <li class="nav-item">
                                <a class="menu-link menu-link-main"
                                   href="{% url 'article:article_list' %}">
                                    {% trans 'مقالات' %}
                                </a>
                            </li>


                            <!-- Board -->
                            <li class="nav-item">
                                <a class="menu-link menu-link-main"
                                   href="{% url 'stockholder:list' %}">
                                    {% trans 'هیئت مدیره' %}
                                </a>
                            </li>


                            <!-- Contact -->
                            <li class="nav-item">
                                <a class="menu-link menu-link-main"
                                   href="{% url 'home:contact' %}">
                                    {% trans 'تماس با ما' %}
                                </a>
                            </li>


                            <!-- Mobile Language Switcher -->
                            <li class="nav-item d-lg-none">

                                <div class="language-switcher d-flex align-items-center gap-3"
                                     style="margin-top: 20px;">

                                    <!-- Persian -->
                                    <form action="{% url 'set_language' %}"
                                          method="post"
                                          style="margin: 0;">

                                        {% csrf_token %}

                                        <input type="hidden"
                                               name="language"
                                               value="fa">

                                        <input type="hidden"
                                               name="next"
                                               value="{{ request.get_full_path }}">

                                        <button type="submit"
                                                aria-label="فارسی"
                                                title="فارسی"
                                                style="
                                                    border: none;
                                                    background: transparent;
                                                    padding: 5px;
                                                    cursor: pointer;
                                                ">

                                            <img src="{% static 'img/flags/flag-for-flag-iran-svgrepo-com.svg' %}"
                                                 alt="فارسی"
                                                 width="32"
                                                 height="22"
                                                 style="display: block;width: 40px">

                                        </button>

                                    </form>


                                    <!-- English -->
                                    <form action="{% url 'set_language' %}"
                                          method="post"
                                          style="margin: 0;">

                                        {% csrf_token %}

                                        <input type="hidden"
                                               name="language"
                                               value="en">

                                        <input type="hidden"
                                               name="next"
                                               value="{{ request.get_full_path }}">

                                        <button type="submit"
                                                aria-label="English"
                                                title="English"
                                                style="
                                                    border: none;
                                                    background: transparent;
                                                    padding: 5px;
                                                    cursor: pointer;
                                                ">

                                            <img src="{% static 'img/flags/flag-for-flag-united-kingdom-svgrepo-com.svg' %}"
                                                 alt="English"
                                                 width="32"
                                                 height="22"
                                                 style="display: block;width: 40px">

                                        </button>

                                    </form>

                                </div>

                            </li>

                        </ul>

                    </nav>
                </drawer-menu>


                <!-- Header Actions -->
                <div class="header-actions d-flex align-items-center">


                    <!-- Desktop Language Switcher -->
                    <div class="language-switcher d-none d-lg-flex align-items-center gap-2">

                        <!-- Persian -->
                        <form action="{% url 'set_language' %}"
                              method="post"
                              style="margin: 0;">

                            {% csrf_token %}

                            <input type="hidden"
                                   name="language"
                                   value="fa">

                            <input type="hidden"
                                   name="next"
                                   value="{{ request.get_full_path }}">

                            <button type="submit"
                                    aria-label="فارسی"
                                    title="فارسی"
                                    style="
                                        border: none;
                                        background: transparent;
                                        padding: 4px;
                                        cursor: pointer;
                                    ">

                                <img src="{% static 'img/flags/flag-for-flag-iran-svgrepo-com.svg' %}"
                                     alt="فارسی"
                                     width="28"
                                     height="20"
                                     style="display: block;width: 40px">

                            </button>

                        </form>


                        <!-- English -->
                        <form action="{% url 'set_language' %}"
                              method="post"
                              style="margin: 0;">

                            {% csrf_token %}

                            <input type="hidden"
                                   name="language"
                                   value="en">

                            <input type="hidden"
                                   name="next"
                                   value="{{ request.get_full_path }}">

                            <button type="submit"
                                    aria-label="English"
                                    title="English"
                                    style="
                                        border: none;
                                        background: transparent;
                                        padding: 4px;
                                        cursor: pointer;
                                    ">

                                <img src="{% static 'img/flags/flag-for-flag-united-kingdom-svgrepo-com.svg' %}"
                                     alt="English"
                                     width="28"
                                     height="20"
                                     style="display: block;width: 40px;">

                            </button>

                        </form>

                    </div>
                    


                    <!-- Mobile Menu Button -->
                    <drawer-opener class="svg-wrapper menu-open d-lg-none"
                                   data-drawer=".drawer-menu">

                        <svg fill="none"
                             height="52"
                             viewbox="0 0 52 52"
                             width="52"
                             xmlns="http://www.w3.org/2000/svg">

                            <circle cx="26"
                                    cy="26"
                                    fill="white"
                                    r="25.5"
                                    stroke="currentColor">
                            </circle>

                            <path d="M32.5 18.2857C32.5 17.5757 31.9179 17 31.2 17H14.3C13.5821 17 13 17.5757 13 18.2857C13 18.9958 13.5821 19.5714 14.3 19.5714H31.2C31.9179 19.5714 32.5 18.9957 32.5 18.2857ZM14.3 24.7143H37.7C38.4179 24.7143 39 25.29 39 26C39 26.7101 38.4179 27.2857 37.7 27.2857H14.3C13.5821 27.2857 13 26.7101 13 26C13 25.29 13.5821 24.7143 14.3 24.7143ZM14.3 32.4286H26C26.7179 32.4286 27.3 33.0042 27.3 33.7143C27.3 34.4243 26.7179 35 26 35H14.3C13.5821 35 13 34.4243 13 33.7143C13 33.0042 13.5821 32.4286 14.3 32.4286Z"
                                  fill="currentColor">
                            </path>

                        </svg>

                    </drawer-opener>

                </div>

            </div>
        </div>
    </header>
</sticky-header>
